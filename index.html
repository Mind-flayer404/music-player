<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" 
    integrity="sha384-AYmEC3Yw5cVb3ZcuHtOA93w35dYTsvhLPVnYs9eStHfGJvOvKxVfELGroGkvsg+p" crossorigin="anonymous"/>
    <link rel="shortcut icon" type="ico" href="src/favicon.jpg">
    <title>Steins; Gate Album</title>
</head>
<body>
    <div class="box">
        <div class="player glassmorphism">
            <audio id="music-player"></audio>
            
            <div class="song-info">
                <div class="img-container">
                    <img id="song-image" src="src/favicon.jpg">
                </div>
                <div class="song-name">
                    <h1 id="song-title">Select a Song</h1>
                    <p id="artist-name">Steins;Gate Series</p>
                </div>
            </div>
            
            <div class="progress-container">
                <span id="current-time" class="time">0:00</span>
                <input type="range" id="progress-bar" class="progress-bar" value="0" min="0" max="100">
                <span id="duration" class="time">0:00</span>
            </div>

            <div class="player-controls">
                <button id="shuffle-btn" class="control-btn" title="Shuffle"><i class="fas fa-random"></i></button>
                <button id="skip-prev" class="skip-btn" title="Previous"><i class="fas fa-step-backward fa-lg"></i></button>
                <button id="play-btn" class="play" title="Play/Pause"><i id="play-icon" class="fas fa-play fa-2x"></i></button>
                <button id="skip-next" class="skip-btn" title="Next"><i class="fas fa-step-forward fa-lg"></i></button>
                <button id="repeat-btn" class="control-btn" title="Repeat"><i id="repeat-icon" class="fas fa-redo"></i></button>
            </div>

            <div class="volume-container">
                <button id="mute-btn" class="control-btn volume-icon"><i id="volume-icon" class="fas fa-volume-up"></i></button>
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="0.5">
            </div>

            <div class="in-queue">
                <p>Next: <span id="next-up">Loading...</span></p>
            </div>
        </div>
    </div>
    <script src="file.js"></script>
</body>
</html>
